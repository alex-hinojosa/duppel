<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhantomGrid Regression Tests</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #111; color: #ccc; padding: 20px; }
    h1 { color: #0f0; margin-bottom: 12px; }
    h2 { color: #888; margin: 16px 0 8px; font-size: 14px; text-transform: uppercase; }
    .suite { border: 1px solid #333; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    .test { padding: 4px 8px; margin: 2px 0; border-radius: 3px; }
    .pass { background: #0a2e0a; color: #4f4; }
    .fail { background: #2e0a0a; color: #f44; }
    .info { background: #1a1a2e; color: #88f; }
    #summary { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 16px; }
    #summary.all-pass { background: #0a2e0a; color: #4f4; border: 1px solid #4f4; }
    #summary.has-fail { background: #2e0a0a; color: #f44; border: 1px solid #f44; }
    button { background: #333; color: #ccc; border: 1px solid #555; padding: 8px 16px;
             border-radius: 4px; cursor: pointer; font-family: monospace; margin: 4px; }
    button:hover { background: #444; }
  </style>
</head>
<body>
  <h1>PhantomGrid Regression Tests</h1>
  <p style="color:#666;margin-bottom:12px">Load this page with the extension active. All stability tests should PASS.</p>
  <button onclick="runAll()">Run All Tests</button>
  <button onclick="runCanvasTests()">Canvas</button>
  <button onclick="runAudioTests()">Audio</button>
  <button onclick="runMeasureTextTests()">measureText</button>
  <button onclick="runProfileTests()">Profile</button>
  <button onclick="runWorkerTests()">Classic Worker</button>
  <button onclick="runModuleWorkerTests()">Module Worker</button>
  <button onclick="runSharedWorkerTests()">SharedWorker</button>
  <button onclick="runMatchMediaTests()">matchMedia</button>
  <button onclick="runSensorTests()">Sensors</button>
  <button onclick="runUltrasonicTests()">Ultrasonic</button>
  <button onclick="runBiometricTests()">Biometric</button>
  <button onclick="runRotationTests()">Rotation</button>
  <div id="results"></div>
  <div id="summary"></div>

  <!-- Hidden canvas for tests -->
  <canvas id="testCanvas" width="200" height="50" style="display:none"></canvas>

  <script src="regression.js"></script>
</body>
</html>
